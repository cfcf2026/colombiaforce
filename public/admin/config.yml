backend:
  name: github
  repo: cfcf2026/colombiaforce
  branch: main
  base_url: https://sveltia-cms-auth.colombiaforce2026.workers.dev

site_url: https://colombiaforce.com
display_url: https://colombiaforce.com

i18n:
  structure: multiple_folders
  locales: [es, en]
  default_locale: es

media_folder: "src/assets/blog-images"
public_folder: "/src/assets/blog-images"

collections:
  - name: "blog"
    label: "Notas"
    folder: "src/content/blog/es"
    create: true
    slug: "{{slug}}"
    i18n: true
    fields:
      - { label: "Título", name: "title", widget: "string", i18n: true }
      - { label: "Descripción", name: "description", widget: "text", i18n: true }
      - { label: "Fecha de publicación", name: "pubDate", widget: "datetime", format: "MMM DD YYYY" }
      - { label: "Fecha de actualización", name: "updatedDate", widget: "datetime", format: "MMM DD YYYY", required: false }
      - { label: "Imagen destacada", name: "heroImage", widget: "image", required: false }
      - label: "Categoría"
        name: "category"
        widget: "select"
        options:
          - { label: "Operativos", value: "operativos" }
          - { label: "Incautaciones", value: "incautaciones" }
          - { label: "Sometimientos", value: "sometimientos" }
          - { label: "Bajas", value: "bajas" }
      - { label: "Cuerpo", name: "body", widget: "markdown", i18n: true }
