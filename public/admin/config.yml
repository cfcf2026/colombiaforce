backend:
  name: github
  repo: cfcf2026/colombiaforce
  branch: main
  base_url: https://sveltia-cms-auth.colombiaforce2026.workers.dev

i18n:
  structure: multiple_folders
  locales: [es, en]
  default_locale: es

media_folder: public/images
public_folder: /images

collections:
  - name: blog
    label: Notas
    folder: src/content/blog
    extension: md
    format: frontmatter
    create: true
    i18n: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Título, widget: string, i18n: true }
      - { name: description, label: Descripción, widget: text, i18n: true }
      - { name: pubDate, label: Fecha, widget: datetime, i18n: duplicate }
      - { name: category, label: Categoría, widget: select, i18n: duplicate,
          options: [operativos, incautaciones, sometimientos, bajas] }
      - { name: heroImage, label: Imagen principal, widget: image, required: false, i18n: true }
      - { name: imageAlt, label: Descripción de la imagen, widget: string, required: false, i18n: true }
      - { name: urlSlug, label: Dirección web (slug), widget: string, required: false, i18n: true,
          hint: "Opcional. Solo minúsculas, números y guiones. Ej: urano-task-force-fuel-theft. Si lo dejas vacío se usa el nombre del archivo.",
          pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Solo minúsculas, números y guiones'] }
      - { name: body, label: Cuerpo, widget: markdown, i18n: true }
